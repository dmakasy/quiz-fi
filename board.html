<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement</title>
<style>
  :root{--bg:#0f2b2c;--card:#123536;--ink:#eaf2f0;--muted:#9fc0bd;--gold:#e0b45a;--line:#1e4647;}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:24px}
  h1{color:var(--gold);text-align:center;margin:6px 0}
  .sub{text-align:center;color:var(--muted);margin-bottom:16px}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:18px 0}
  .pod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;min-width:160px}
  .pod .m{font-size:40px}.pod .nm{font-weight:800;font-size:22px;margin-top:6px}.pod .sc{color:var(--gold);font-weight:800}
  .pod.p1{border-color:var(--gold);transform:translateY(-18px)}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;font-size:20px}
  .row .rk{font-weight:900;color:var(--gold);width:36px}.row .nm{flex:1;font-weight:700}.row .sc{font-weight:800;color:var(--gold)}
  .done{color:var(--muted);font-size:13px;margin-left:8px}
  .empty{text-align:center;color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Classement</h1>
  <div class="sub" id="count">En attente des joueurs…</div>
  <div class="podium" id="podium"></div>
  <div id="list"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(); const $=id=>document.getElementById(id);
socket.on("connect",()=>socket.emit("board:join"));
socket.on("leaderboard", d=>{
  $("title").textContent=d.title||"Classement";
  $("count").textContent=(d.count||0)+" joueur"+((d.count||0)>1?"s":"");
  const b=d.board||[];
  const medals=["🥇","🥈","🥉"], order=[1,0,2];
  $("podium").innerHTML=order.filter(k=>b[k]).map(k=>'<div class="pod p'+(k+1)+'"><div class="m">'+medals[k]+'</div><div class="nm">'+esc(b[k].name)+'</div><div class="sc">'+b[k].score+' pts</div></div>').join("");
  const rest=b.slice(3);
  $("list").innerHTML = b.length ? rest.map((p,i)=>'<div class="row"><span class="rk">'+(i+4)+'</span><span class="nm">'+esc(p.name)+(p.finished?'<span class="done">terminé</span>':'')+'</span><span class="sc">'+p.score+' pts</span></div>').join("") : '<div class="empty">Personne n\'a encore rejoint.</div>';
});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
</script>
</body>
</html>
