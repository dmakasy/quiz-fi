<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<style>
  :root{--bg:#0f2b2c;--card:#123536;--ink:#eaf2f0;--muted:#9fc0bd;--gold:#e0b45a;--good:#3fbf7a;--bad:#e06a6a;--line:#1e4647;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
  .wrap{max-width:560px;margin:0 auto;width:100%;padding:16px 16px calc(20px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .brand{color:var(--gold);font-weight:800;font-size:16px}
  .mute{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:13px}
  h1{color:var(--gold);text-align:center;font-size:26px;margin:10px 0 4px}
  .sub{color:var(--muted);text-align:center;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .mid{margin-top:auto;margin-bottom:auto}
  input{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;font-size:18px;background:#0f2b2c;color:var(--ink);text-align:center}
  .btn{width:100%;background:var(--gold);color:#231a06;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:800;margin-top:12px}
  .err{color:var(--bad);text-align:center;margin-top:10px;min-height:20px}
  .qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
  .pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .pbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .qimg{text-align:center;margin:6px 0 12px}
  .qimg img{max-height:190px;max-width:100%;border-radius:12px}
  .qtext{font-size:22px;font-weight:800;line-height:1.3;margin:4px 0 16px;text-align:center}
  .opts{display:grid;gap:12px}
  .opt{border:none;border-radius:14px;color:#fff;font-size:18px;font-weight:700;padding:18px 16px;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
  .opt .l{font-weight:900;opacity:.9}
  .o0{background:#c0392b}.o1{background:#2e6fb0}.o2{background:#caa227;color:#231a06}.o3{background:#2c8a58}
  .opt:disabled{opacity:.85}
  .opt.correct{outline:4px solid #fff}.opt.wrong{opacity:.5}
  .fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:800;text-align:center;display:none}
  .fb.show{display:block}.fb.good{background:#14361f;color:var(--good)}.fb.bad{background:#3a1a1a;color:var(--bad)}
  .fb .s{display:block;font-weight:600;color:var(--ink);margin-top:4px;font-size:15px}
  .score{color:var(--muted);text-align:center;margin-top:10px;font-size:15px}
  .big{font-size:60px;text-align:center;margin:6px 0}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:14px 0}
  .pod{background:#0f2b2c;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:92px}
  .pod .m{font-size:26px}.pod .nm{font-weight:800;margin-top:4px}.pod .sc{color:var(--gold);font-weight:800;font-size:14px}
  .pod.p1{border-color:var(--gold);transform:translateY(-10px)}
  .center{text-align:center}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span class="brand" id="brand">Quiz</span><button class="mute" id="mute">🔊</button></div>

  <!-- JOIN -->
  <section id="join" class="card mid">
    <h1 id="jtitle">Quiz</h1>
    <div class="sub">Tu joues sur ton téléphone. Réponds : tu vois tout de suite si c'est juste.</div>
    <input id="name" placeholder="Ton prénom" maxlength="24" autocomplete="off">
    <button class="btn" id="joinBtn">Commencer</button>
    <div class="err" id="err"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden" style="flex:1;display:flex;flex-direction:column">
    <div class="qhead"><span id="qnum">Question 1</span><span id="qscore">0 pt</span></div>
    <div class="pbar"><i id="pbar"></i></div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div class="qimg hidden" id="qimg"></div>
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
    </div>
    <button class="btn hidden" id="nextBtn" style="margin-top:14px">Suivant →</button>
  </section>

  <!-- FINAL -->
  <section id="final" class="card mid center hidden">
    <div class="big">🎉</div>
    <h1 id="fscore">0 pts</h1>
    <div class="sub" id="frank"></div>
    <div class="podium" id="podium"></div>
    <button class="btn" onclick="location.reload()">Rejouer</button>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const $=id=>document.getElementById(id);
const SEC=["join","quiz","final"];
function show(id){SEC.forEach(s=>$(s).classList.toggle("hidden",s!==id));}
const OCL=["o0","o1","o2","o3"], L=["A","B","C","D"];

/* Son */
let muted=false; try{muted=localStorage.getItem("qmute")==="1";}catch(_){}
let actx=null;
function AC(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); }catch(_){} return actx; }
function beep(f,d,t,w,v){ if(muted)return; const c=AC(); if(!c)return; try{ const s=c.currentTime+(w||0); const o=c.createOscillator(),g=c.createGain(); o.type=t||"sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(v||0.18,s); g.gain.exponentialRampToValueAtTime(0.0001,s+d); o.start(s); o.stop(s+d);}catch(_){} }
function sndCorrect(){ beep(660,0.12,"sine",0,0.22); beep(880,0.2,"sine",0.12,0.22); }
function sndWrong(){ beep(200,0.32,"square",0,0.16); }
document.addEventListener("click",()=>AC(),{once:true});
$("mute").onclick=()=>{ muted=!muted; try{localStorage.setItem("qmute",muted?"1":"0");}catch(_){} $("mute").textContent=muted?"🔇":"🔊"; };
$("mute").textContent=muted?"🔇":"🔊";

let QS=[], idx=0, score=0, qStart=0, answered=false;
try{ const n=localStorage.getItem("qname"); if(n)$("name").value=n; }catch(_){}

$("joinBtn").onclick=()=>{
  AC();
  const name=$("name").value.trim();
  if(!name){ $("err").textContent="Entre ton prénom."; return; }
  try{ localStorage.setItem("qname",name); }catch(_){}
  socket.emit("join",{name});
};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("joinBtn").click();});

socket.on("start", d=>{
  QS=d.questions||[]; idx=0; score=0;
  $("brand").textContent=d.title; $("jtitle").textContent=d.title; document.title=d.title;
  if(!QS.length){ $("err").textContent="Aucune question chargée."; return; }
  show("quiz"); render();
});
function render(){
  answered=false;
  const q=QS[idx];
  $("qnum").textContent="Question "+(idx+1)+" / "+QS.length;
  $("qscore").textContent=score+" pt"+(score>1?"s":"");
  $("pbar").style.width=(idx/QS.length*100)+"%";
  $("qtext").textContent=q.q;
  if(q.img){ $("qimg").innerHTML='<img src="'+esc(q.img)+'" alt="">'; $("qimg").classList.remove("hidden"); }
  else{ $("qimg").classList.add("hidden"); $("qimg").innerHTML=""; }
  const opts=$("opts"); opts.innerHTML="";
  q.o.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt "+OCL[i];
    b.innerHTML='<span class="l">'+L[i]+'</span><span>'+esc(t)+'</span>';
    b.onclick=()=>choose(i,b);
    opts.appendChild(b);
  });
  const fb=$("fb"); fb.className="fb"; fb.innerHTML="";
  $("nextBtn").classList.add("hidden");
  $("nextBtn").textContent=(idx===QS.length-1)?"Voir mon score →":"Suivant →";
  qStart=Date.now();
}
function choose(i,btn){
  if(answered) return; answered=true;
  const buttons=[...document.querySelectorAll("#opts .opt")];
  buttons.forEach(b=>b.disabled=true);
  socket.emit("answer",{index:idx, choice:i, timeMs:Date.now()-qStart});
  // le résultat (bonne réponse + points) revient via 'answerResult'
  window._pick={i,btn,buttons};
}
socket.on("answerResult", d=>{
  const {i,btn,buttons}=window._pick||{};
  if(buttons){
    buttons[d.correctIdx] && buttons[d.correctIdx].classList.add("correct");
    if(!d.correct && btn) btn.classList.add("wrong");
  }
  score=d.score; $("qscore").textContent=score+" pt"+(score>1?"s":"");
  const fb=$("fb");
  if(d.correct){ sndCorrect(); fb.className="fb good show"; fb.innerHTML="✓ Bonne réponse ! <span class='s'>+"+d.gain+" pts</span>"; }
  else{ sndWrong(); fb.className="fb bad show"; fb.innerHTML="✗ Pas cette fois <span class='s'>Bonne réponse : "+L[d.correctIdx]+"</span>"; }
  $("nextBtn").classList.remove("hidden");
});
$("nextBtn").onclick=()=>{
  if(idx<QS.length-1){ idx++; render(); }
  else{ socket.emit("finish"); }
};
socket.on("final", d=>{
  $("fscore").textContent=d.score+" pts";
  $("frank").textContent="Tu es "+d.rank+(d.rank===1?"er":"e")+" sur "+d.total;
  const medals=["🥇","🥈","🥉"], order=[1,0,2];
  $("podium").innerHTML=order.filter(k=>d.podium[k]).map(k=>'<div class="pod p'+(k+1)+'"><div class="m">'+medals[k]+'</div><div class="nm">'+esc(d.podium[k].name)+'</div><div class="sc">'+d.podium[k].score+'</div></div>').join("");
  show("final");
});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
</script>
</body>
</html>
