<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz - Animateur</title>
<style>
  :root{--bg:#0f2b2c;--card:#123536;--ink:#eaf2f0;--muted:#9fc0bd;--gold:#e0b45a;--good:#3fbf7a;--bad:#e06a6a;--line:#1e4647;}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .topbar{display:flex;justify-content:flex-end}
  .mute{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px}
  h1{color:var(--gold);text-align:center;margin:6px 0 2px;font-size:28px}
  .sub{text-align:center;color:var(--muted);margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px}
  .join{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pinbox{text-align:center}
  .pinlabel{color:var(--muted);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .pin{font-size:56px;font-weight:800;letter-spacing:.12em;color:var(--gold);line-height:1.1}
  .url{color:var(--ink);font-size:16px;margin-top:8px;word-break:break-all}
  .url b{color:var(--gold)}
  #qr img{width:240px;height:240px;border-radius:12px;background:#fff;padding:8px}
  .btn{background:var(--gold);color:#231a06;border:none;border-radius:14px;padding:16px 26px;font-size:20px;font-weight:800;cursor:pointer;margin-top:14px;text-decoration:none;display:inline-block}
  .btn.sec{background:transparent;color:var(--gold);border:2px solid var(--gold)}
  .import{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .import .btn{font-size:15px;padding:10px 16px;margin-top:0}
  #impmsg{color:var(--muted);font-size:14px}
  .players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .chip{background:#0f2b2c;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700}
  .count{text-align:center;color:var(--muted);margin-top:10px;font-size:18px}
  .qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:18px}
  .qimg{text-align:center;margin:10px 0}
  .qimg img{max-height:260px;max-width:100%;border-radius:12px}
  .qtext{font-size:32px;font-weight:800;text-align:center;margin:14px 0 20px;line-height:1.25}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{padding:20px;border-radius:14px;font-size:22px;font-weight:700;color:#fff;display:flex;gap:12px;align-items:center}
  .opt .l{font-weight:900;font-size:26px;opacity:.85}
  .o0{background:#c0392b}.o1{background:#2e6fb0}.o2{background:#caa227;color:#231a06}.o3{background:#2c8a58}
  .opt.dim{opacity:.28}.opt.win{outline:5px solid #fff}
  .timer{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0}
  .timer>i{display:block;height:100%;width:100%;background:var(--gold);transition:width 1s linear}
  .prog{text-align:center;color:var(--muted);margin-top:8px;font-size:18px}
  .board{max-width:560px;margin:14px auto 0}
  .row{display:flex;align-items:center;gap:12px;background:#0f2b2c;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;font-size:20px}
  .row .rk{font-weight:900;color:var(--gold);width:34px}
  .row .nm{flex:1;font-weight:700}.row .sc{font-weight:800;color:var(--gold)}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:20px 0}
  .pod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;min-width:150px}
  .pod .m{font-size:34px}.pod .nm{font-weight:800;font-size:20px;margin-top:6px}.pod .sc{color:var(--gold);font-weight:800}
  .pod.p1{border-color:var(--gold);transform:translateY(-16px)}
  .center{text-align:center}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="mute" id="mute">🔊 Son</button></div>
  <h1 id="title">Quiz</h1>
  <div class="sub">Écran animateur</div>

  <!-- LOBBY -->
  <section id="lobby" class="card">
    <div class="join">
      <div class="pinbox">
        <div class="pinlabel">Code PIN</div>
        <div class="pin" id="pin">----</div>
        <div class="url">Sur le téléphone : <b id="url">...</b></div>
      </div>
      <div id="qr"></div>
    </div>
    <div class="center"><button class="btn" id="startBtn" disabled>Démarrer la partie</button></div>
    <div class="import">
      <a class="btn sec" href="/template.xlsx">⬇ Modèle Excel</a>
      <label class="btn sec">📄 Importer un fichier Excel/CSV<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></label>
      <span id="impmsg"></span>
    </div>
    <div class="count" id="count">0 joueur connecté</div>
    <div class="players" id="players"></div>
  </section>

  <!-- QUESTION -->
  <section id="question" class="card hidden">
    <div class="qhead"><span id="qnum">Question 1</span><span id="qtimer">20 s</span></div>
    <div class="timer"><i id="timerbar"></i></div>
    <div class="qimg hidden" id="qimg"></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="qopts"></div>
    <div class="prog" id="qprog">0 / 0 ont répondu</div>
  </section>

  <!-- REVEAL -->
  <section id="reveal" class="card hidden">
    <div class="qtext" id="rtext">Réponse</div>
    <div class="opts" id="ropts"></div>
    <h1 style="margin-top:22px">Classement</h1>
    <div class="board" id="rboard"></div>
    <div class="center"><button class="btn" id="nextBtn">Question suivante</button></div>
  </section>

  <!-- ENDED -->
  <section id="ended" class="card hidden">
    <h1>🏆 Podium</h1>
    <div class="podium" id="podium"></div>
    <div class="board" id="fboard"></div>
    <div class="center"><button class="btn sec" onclick="location.reload()">Nouvelle partie</button></div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const $=id=>document.getElementById(id);
const SEC=["lobby","question","reveal","ended"];
function show(id){SEC.forEach(s=>$(s).classList.toggle("hidden",s!==id));}
const OCL=["o0","o1","o2","o3"], L=["A","B","C","D"];

/* ---- Son (synthétisé, hors ligne) ---- */
let muted=false; try{muted=localStorage.getItem("qmute")==="1";}catch(_){}
let actx=null;
function AC(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); }catch(_){} return actx; }
function beep(freq,dur,type,when,vol){ if(muted)return; const c=AC(); if(!c)return; try{ const t=c.currentTime+(when||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.value=freq; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur);}catch(_){} }
function sndTick(){ beep(520,0.05,"sine",0,0.12); }
function sndReveal(){ beep(440,0.12,"triangle",0,0.18); beep(330,0.22,"triangle",0.12,0.16); }
function sndGo(){ beep(392,0.12,"sine",0,0.16); beep(523,0.16,"sine",0.12,0.16); }
document.addEventListener("click",()=>AC(),{once:true});
$("mute").onclick=()=>{ muted=!muted; try{localStorage.setItem("qmute",muted?"1":"0");}catch(_){} $("mute").textContent=muted?"🔇 Muet":"🔊 Son"; };
$("mute").textContent=muted?"🔇 Muet":"🔊 Son";

socket.on("connect", ()=> socket.emit("host:create",{origin:location.origin}));
socket.on("host:created", d=>{
  $("title").textContent=d.title; document.title=d.title+" - Animateur";
  $("pin").textContent=d.pin; $("url").textContent=(d.base||"").replace(/^https?:\/\//,"")+"/play";
  if(d.qr) $("qr").innerHTML='<img src="'+d.qr+'" alt="QR">';
  setStart(d.total);
});
function setStart(total){ $("startBtn").textContent="Démarrer la partie ("+total+" questions)"; }
socket.on("host:lobby", d=>{
  $("count").textContent=d.count+" joueur"+(d.count>1?"s":"")+" connecté"+(d.count>1?"s":"");
  $("players").innerHTML=d.players.map(n=>'<span class="chip">'+esc(n)+'</span>').join("");
  $("startBtn").disabled=d.count<1;
});
$("startBtn").onclick=()=>{ AC(); socket.emit("host:start"); };
$("nextBtn").onclick=()=>socket.emit("host:next");

/* ---- Import Excel/CSV ---- */
$("file").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  $("impmsg").textContent="Import de « "+f.name+" »…";
  try{
    const buf=await f.arrayBuffer();
    const r=await fetch("/import?name="+encodeURIComponent(f.name),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:buf});
    const j=await r.json();
    if(!r.ok){ $("impmsg").textContent="⚠ "+(j.error||"Échec de l'import"); }
    else{ $("impmsg").textContent="✅ "+j.count+" questions importées ("+j.title+")"; $("title").textContent=j.title; setStart(j.count); $("startBtn").disabled=false; }
  }catch(err){ $("impmsg").textContent="⚠ "+err.message; }
  e.target.value="";
});

/* ---- Déroulé ---- */
let tInt=null;
socket.on("host:question", d=>{
  show("question"); sndGo();
  $("qnum").textContent="Question "+(d.index+1)+" / "+d.total;
  $("qtext").textContent=d.q;
  if(d.img){ $("qimg").innerHTML='<img src="'+esc(d.img)+'" alt="">'; $("qimg").classList.remove("hidden"); }
  else { $("qimg").classList.add("hidden"); $("qimg").innerHTML=""; }
  $("qopts").innerHTML=d.o.map((t,i)=>'<div class="opt '+OCL[i]+'"><span class="l">'+L[i]+'</span><span>'+esc(t)+'</span></div>').join("");
  $("qprog").textContent="0 / ? ont répondu";
  startTimer(d.limit);
});
socket.on("host:progress", d=>{ $("qprog").textContent=d.answered+" / "+d.total+" ont répondu"; });
socket.on("host:reveal", d=>{
  clearInterval(tInt); show("reveal"); sndReveal();
  $("rtext").textContent="Bonne réponse : "+L[d.correctIdx];
  $("ropts").innerHTML=d.o.map((t,i)=>'<div class="opt '+OCL[i]+(i===d.correctIdx?' win':' dim')+'"><span class="l">'+L[i]+'</span><span>'+esc(t)+'</span></div>').join("");
  $("rboard").innerHTML=boardHtml(d.board);
  $("nextBtn").textContent=d.last?"Voir le podium 🏆":"Question suivante";
});
socket.on("host:ended", d=>{
  show("ended"); sndReveal();
  const medals=["🥇","🥈","🥉"], order=[1,0,2];
  $("podium").innerHTML=order.filter(i=>d.podium[i]).map(i=>'<div class="pod p'+(i+1)+'"><div class="m">'+medals[i]+'</div><div class="nm">'+esc(d.podium[i].name)+'</div><div class="sc">'+d.podium[i].score+' pts</div></div>').join("");
  $("fboard").innerHTML=boardHtml(d.board);
});
function startTimer(limit){
  clearInterval(tInt); let s=limit;
  const bar=$("timerbar"); bar.style.transition="none"; bar.style.width="100%";
  void bar.offsetWidth; bar.style.transition="width "+limit+"s linear"; bar.style.width="0%";
  $("qtimer").textContent=s+" s";
  tInt=setInterval(()=>{ s--; if(s<0)s=0; $("qtimer").textContent=s+" s"; if(s<=3&&s>0)sndTick(); if(s<=0)clearInterval(tInt); },1000);
}
function boardHtml(b){return b.map((p,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(p.name)+'</span><span class="sc">'+p.score+' pts</span></div>').join("");}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
</script>
</body>
</html>
