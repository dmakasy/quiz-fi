<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz - Joueur</title>
<style>
  :root{--bg:#0f2b2c;--card:#123536;--ink:#eaf2f0;--muted:#9fc0bd;--gold:#e0b45a;--good:#3fbf7a;--bad:#e06a6a;--line:#1e4647;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
  .wrap{max-width:520px;margin:0 auto;width:100%;padding:16px 16px calc(20px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
  .topbar{display:flex;justify-content:flex-end}
  .mute{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:13px}
  h1{color:var(--gold);text-align:center;font-size:24px;margin:6px 0 4px}
  .sub{color:var(--muted);text-align:center;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:auto;margin-bottom:auto}
  input{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;font-size:18px;background:#0f2b2c;color:var(--ink);text-align:center}
  .btn{width:100%;background:var(--gold);color:#231a06;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:800;margin-top:12px}
  .err{color:var(--bad);text-align:center;margin-top:10px;min-height:20px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:stretch}
  .opt{border:none;border-radius:16px;color:#fff;font-size:22px;font-weight:800;min-height:110px;display:flex;align-items:center;justify-content:center;padding:14px}
  .o0{background:#c0392b}.o1{background:#2e6fb0}.o2{background:#caa227;color:#231a06}.o3{background:#2c8a58}
  .opt:disabled{opacity:.55}
  .status{text-align:center}
  .big{font-size:64px;margin:6px 0}
  .verdict{font-size:26px;font-weight:800}
  .gain{color:var(--gold);font-size:22px;font-weight:800;margin-top:6px}
  .score{color:var(--muted);margin-top:8px;font-size:18px}
  .hidden{display:none!important}
  .qnum{text-align:center;color:var(--muted);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="mute" id="mute">🔊</button></div>

  <!-- JOIN -->
  <section id="join" class="card">
    <h1 id="jtitle">Rejoindre le quiz</h1>
    <div class="sub">Entre ton prénom pour jouer</div>
    <input id="name" placeholder="Ton prénom" maxlength="24" autocomplete="off">
    <input id="pin" placeholder="Code PIN" inputmode="numeric" maxlength="4" style="margin-top:10px">
    <button class="btn" id="joinBtn">Rejoindre</button>
    <div class="err" id="err"></div>
  </section>

  <!-- WAIT -->
  <section id="wait" class="card hidden status">
    <div class="big">✅</div>
    <div class="verdict" id="waittxt">Tu es dans la partie !</div>
    <div class="sub" style="margin-top:8px" id="waitsub">Regarde l'écran principal, la partie va commencer.</div>
  </section>

  <!-- QUESTION -->
  <section id="question" class="hidden" style="flex:1;display:flex;flex-direction:column">
    <div class="qnum" id="qnum">Question 1</div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="card hidden status">
    <div class="big" id="rmark">✓</div>
    <div class="verdict" id="rtxt">Bonne réponse !</div>
    <div class="gain" id="rgain"></div>
    <div class="score" id="rscore"></div>
    <div class="sub" id="rrank" style="margin-top:10px"></div>
  </section>

  <!-- ENDED -->
  <section id="ended" class="card hidden status">
    <div class="big">🎉</div>
    <div class="verdict">Merci d'avoir joué !</div>
    <div class="score" id="escore"></div>
    <div class="sub" id="erank" style="margin-top:8px"></div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const $=id=>document.getElementById(id);
const SEC=["join","wait","question","result","ended"];
function show(id){SEC.forEach(s=>$(s).classList.toggle("hidden",s!==id));}
const OCL=["o0","o1","o2","o3"], L=["A","B","C","D"];

/* ---- Son ---- */
let muted=false; try{muted=localStorage.getItem("qmute")==="1";}catch(_){}
let actx=null;
function AC(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); }catch(_){} return actx; }
function beep(freq,dur,type,when,vol){ if(muted)return; const c=AC(); if(!c)return; try{ const t=c.currentTime+(when||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.value=freq; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(vol||0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur);}catch(_){} }
function sndCorrect(){ beep(660,0.12,"sine",0,0.22); beep(880,0.2,"sine",0.12,0.22); }
function sndWrong(){ beep(200,0.32,"square",0,0.16); }
document.addEventListener("click",()=>AC(),{once:true});
$("mute").onclick=()=>{ muted=!muted; try{localStorage.setItem("qmute",muted?"1":"0");}catch(_){} $("mute").textContent=muted?"🔇":"🔊"; };
$("mute").textContent=muted?"🔇":"🔊";

const params=new URLSearchParams(location.search);
if(params.get("pin")) $("pin").value=params.get("pin");
try{ const n=localStorage.getItem("qname"); if(n)$("name").value=n; }catch(_){}

$("joinBtn").onclick=()=>{
  AC();
  const name=$("name").value.trim(), pin=$("pin").value.trim();
  if(!name){ $("err").textContent="Entre ton prénom."; return; }
  if(!pin){ $("err").textContent="Entre le code PIN."; return; }
  try{ localStorage.setItem("qname",name); }catch(_){}
  socket.emit("player:join",{pin,name});
};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("pin").focus();});
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("joinBtn").click();});

socket.on("player:error",m=>{ $("err").textContent=m; });
socket.on("player:joined",d=>{ $("waittxt").textContent="Bienvenue "+d.name+" !"; show("wait"); });

socket.on("player:question",d=>{
  const opts=$("opts"); opts.innerHTML="";
  $("qnum").textContent="Question "+(d.index+1)+" / "+d.total;
  for(let i=0;i<d.count;i++){
    const b=document.createElement("button");
    b.className="opt "+OCL[i]; b.textContent=L[i];
    b.onclick=()=>answer(i,opts);
    opts.appendChild(b);
  }
  show("question");
});
function answer(i,opts){ [...opts.children].forEach(b=>b.disabled=true); socket.emit("player:answer",{idx:i}); }

socket.on("player:result",d=>{
  if(d.correct) sndCorrect(); else sndWrong();
  $("rmark").textContent=d.correct?"✓":"✗";
  $("rmark").style.color=d.correct?"var(--good)":"var(--bad)";
  $("rtxt").textContent=d.correct?"Bonne réponse !":(d.timeout?"Trop tard !":"Pas cette fois");
  $("rgain").textContent=d.gain>0?("+"+d.gain+" pts"):"";
  $("rscore").textContent="Score : "+d.score+" pts";
  $("rrank").textContent="";
  show("result");
});
socket.on("player:board",d=>{ $("rrank").textContent="Tu es "+d.rank+(d.rank===1?"er":"e")+" sur "+d.total; });
socket.on("player:ended",()=>{
  const sc=($("rscore").textContent||"").replace("Score : ","");
  $("escore").textContent="Ton score final : "+(sc||"0 pts");
  $("erank").textContent=$("rrank").textContent;
  show("ended");
});
</script>
</body>
</html>
